[package]
name = "visura"
version = "0.1.3"
edition = "2024"
rust-version = "1.85"
description = "A small screenshot tool for Windows and Linux"
license = "MIT"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = [
    "glow",
    "default_fonts",
    "x11",
] }
egui = { version = "0.36.2", default-features = false }
image = { version = "0.25.10", default-features = false, features = [
    "png",
    "jpeg",
] }
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1.1.6", default-features = false, features = [
    "parse",
    "display",
    "serde",
] }
global-hotkey = "0.8.0"
arboard = { version = "3.6.1", default-features = false, features = [
    "image-data",
] }

raw-window-handle = "0.6.2"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.25.1"
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
    "Win32_System_SystemInformation",
    "Win32_System_Time",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"
serde_json = "1.0"
x11rb = { version = "0.14.0", default-features = false, features = [
    "allow-unsafe-code",
    "randr",
] }

[build-dependencies]
winresource = "0.1.31"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
